name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'stitch_*/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: edusexual-pt
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: edusexual-pt/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests (jest)
        run: npm test -- --passWithNoTests

      - name: Bundle audit guard
        run: node scripts/audit-bundle.mjs 2>&1 | head -n 50 || true

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-typecheck-test
    defaults:
      run:
        working-directory: edusexual-pt
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: edusexual-pt/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js)
        run: npm run build
