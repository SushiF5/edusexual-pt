<style>
          body {
              font-family: 'Plus Jakarta Sans', sans-serif;
              background-color: #f0f7fb; /* Light blue custom background as requested, approximating secondary-fixed-dim softly */

<body class="min-h-screen flex flex-col items-center justify-center p-gutter">
<!-- Intent: Transactional/Task-focused form, so global nav shell is suppressed based on Shared Components Logic -->
<main class="w-full max-w-lg mx-auto">
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgb(72,149,239,0.08)] p-xl border border-surface-container-low">
<div class="text-center mb-margin">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-secondary-fixed mb-md">
<span class="material-symbols-outlined text-secondary font-variation-settings-'FILL' 1" data-icon="help_outline" data-weight="fill">help_outline</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Enviar Dúvida</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sente-se seguro para perguntar. O seu anonimato é garantido.</p>
</div>
<!-- Form State -->
<form action="#" class="space-y-lg" method="POST">
<!-- Nome Field (Optional as per context of anonymous, but requested) -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="nome">Nome (Opcional)</label>
<input class="w-full px-md py-sm bg-surface rounded-lg border border-outline-variant text-on-surface font-body-md text-body-md focus:border-secondary focus:ring-4 focus:ring-secondary/20 transition-all outline-none" id="nome" name="nome" placeholder="Como prefere ser chamado?" type="text"/>
</div>
<!-- E-mail Field (Optional as per context, but requested) -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="email">E-mail (Opcional)</label>
<input class="w-full px-md py-sm bg-surface rounded-lg border border-outline-variant text-on-surface font-body-md text-body-md focus:border-secondary focus:ring-4 focus:ring-secondary/20 transition-all outline-none" id="email" name="email" placeholder="Para receber uma resposta direta" type="email"/>
</div>
<!-- Dúvida Field (Required) -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="duvida">Dúvida <span class="text-error">*</span></label>
<textarea class="w-full px-md py-sm bg-surface rounded-lg border border-outline-variant text-on-surface font-body-md text-body-md focus:border-secondary focus:ring-4 focus:ring-secondary/20 transition-all outline-none resize-y" id="duvida" name="duvida" placeholder="Escreva aqui a sua dúvida..." required="" rows="4"></textarea>
</div>
<!-- Privacy note -->
<div class="flex items-start gap-sm bg-surface p-md rounded-lg border border-surface-variant">
<span class="material-symbols-outlined text-primary text-lg mt-0.5" data-icon="lock">lock</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">A sua identidade é protegida. Os campos de nome e e-mail não serão associados publicamente à sua dúvida.</p>
</div>
<!-- Submit Button -->
<button class="w-full flex items-center justify-center gap-sm bg-primary text-on-primary font-label-md text-label-md py-md px-lg rounded-lg hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm" type="button">
<span class="material-symbols-outlined" data-icon="mail">mail</span>
                    Enviar Dúvida
                </button>
</form>
<!-- Success Message State (Hidden by default, shown here for design purposes) -->
<!-- To view the form, comment out this div. To view the success state, uncomment it and comment out the form above. -->
<div class="hidden text-center py-margin">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-fixed mb-md">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="check_circle">check_circle</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-sm">Mensagem Recebida</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-lg">A tua dúvida foi enviada com sucesso e anonimato.</p>
<button class="inline-flex items-center justify-center gap-sm bg-transparent border border-secondary text-secondary font-label-md text-label-md py-sm px-lg rounded-lg hover:bg-secondary-fixed hover:text-on-secondary-container transition-colors" type="button">
                    Enviar nova dúvida
                </button>
</div>
</div>
