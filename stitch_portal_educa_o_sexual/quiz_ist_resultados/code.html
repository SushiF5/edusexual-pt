<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-16 bg-slate-50 dark:bg-slate-950 border-b border-teal-50 dark:border-teal-900 shadow-sm shadow-teal-900/5">
<button class="text-teal-700 dark:text-teal-400 hover:bg-teal-50 dark:hover:bg-teal-900/30 transition-colors duration-200 p-2 rounded-full active:scale-95 transition-transform duration-150">

</button>
<h1 class="font-['Plus_Jakarta_Sans'] text-base font-semibold tracking-tight text-teal-800 dark:text-teal-200">Educação IST</h1>
<button class="text-teal-700 dark:text-teal-400 hover:bg-teal-50 dark:hover:bg-teal-900/30 transition-colors duration-200 p-2 rounded-full active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="info">info</span>
</button>
</header>

<main class="pt-24 px-6 md:px-gutter max-w-container-max mx-auto flex flex-col items-center min-h-[calc(100vh-64px)] justify-center space-y-lg">
<!-- Result Hero Section -->
<section class="w-full max-w-md flex flex-col items-center text-center space-y-6">
<div class="relative w-32 h-32 flex items-center justify-center bg-primary-container rounded-full shadow-[0_8px_32px_rgba(13,122,128,0.15)] ring-8 ring-primary/10">
<span aria-label="Estrela encorajadora" class="text-6xl" role="img">🌟</span>
<!-- Confetti accents (decorative) -->
<div class="absolute -top-4 -right-2 w-4 h-4 bg-secondary-container rounded-full opacity-60"></div>
<div class="absolute top-4 -left-6 w-3 h-3 bg-tertiary-container rounded-full opacity-50"></div>
<div class="absolute bottom-2 -right-4 w-5 h-5 bg-primary-fixed rounded-full opacity-70"></div>
</div>
<div class="space-y-2">
<h2 class="font-h1 text-h1 text-on-surface">O Teu Resultado</h2>
<div class="inline-flex items-center gap-2 bg-surface-container px-4 py-2 rounded-full">
<span class="font-h3 text-h3 text-primary">4/5</span>
<div class="w-1 h-1 bg-outline rounded-full"></div>
<span class="font-label-md text-label-md text-on-surface-variant">Muito Bom!</span>
</div>
</div>
</section>

<div class="flex-shrink-0 w-10 h-10 bg-secondary-container rounded-full flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined" data-icon="lightbulb" data-weight="fill">lightbulb</span>
</div>
<div>
<h3 class="font-label-md text-label-md text-on-surface mb-2">Sugestões de Melhoria</h3>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
                        Reveja o módulo sobre anatomia e formas de transmissão menos comuns.
                    </p>
</div>
</div>

<div class="mt-6 space-y-2">
<div class="flex justify-between text-caption font-caption text-outline">
<span>Taxa de Acerto</span>
<span>80%</span>
</div>
<div class="h-3 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-secondary w-[80%] rounded-full"></div>
</div>
</div>
</section>

<section class="w-full max-w-md space-y-4 pt-4">
<button class="w-full bg-primary hover:bg-surface-tint text-on-primary font-label-md text-label-md py-4 px-6 rounded-xl shadow-[0_4px_12px_rgba(0,96,101,0.2)] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
